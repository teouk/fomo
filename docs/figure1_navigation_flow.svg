<svg xmlns="http://www.w3.org/2000/svg" width="170mm" height="60mm" viewBox="0 0 1700 600">
  <rect x="0" y="0" width="1700" height="600" fill="#FFFFFF"/>

  <rect x="140" y="40" width="430" height="120" rx="18" fill="#006B5F"/>
  <text x="355" y="95" font-family="Times New Roman, Times, serif" font-size="39" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Search &amp; Filter</text>
  <text x="355" y="133" font-family="Times New Roman, Times, serif" font-size="32" fill="#FFFFFF" text-anchor="middle">Filters + results</text>

  <rect x="1130" y="40" width="430" height="120" rx="18" fill="#006B5F"/>
  <text x="1345" y="95" font-family="Times New Roman, Times, serif" font-size="39" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Event Details</text>
  <text x="1345" y="133" font-family="Times New Roman, Times, serif" font-size="32" fill="#FFFFFF" text-anchor="middle">Tickets, weather, check-in</text>

  <line x1="572" y1="100" x2="1102" y2="100" stroke="#424242" stroke-width="4"/>
  <polygon points="1128,100 1102,88 1102,112" fill="#424242"/>
  <text x="850" y="82" font-family="Times New Roman, Times, serif" font-size="32" font-style="italic" fill="#424242" text-anchor="middle">tap a result</text>

  <rect x="60" y="315" width="1580" height="170" rx="22" fill="none" stroke="#8C8C8C" stroke-width="3" stroke-dasharray="14 10"/>

  <rect x="120" y="345" width="320" height="110" rx="16" fill="#006B5F"/>
  <text x="280" y="396" font-family="Times New Roman, Times, serif" font-size="39" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Discover</text>
  <text x="280" y="432" font-family="Times New Roman, Times, serif" font-size="32" fill="#FFFFFF" text-anchor="middle">Home screen</text>

  <rect x="500" y="345" width="320" height="110" rx="16" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="3"/>
  <text x="660" y="396" font-family="Times New Roman, Times, serif" font-size="39" font-weight="bold" fill="#212121" text-anchor="middle">Map</text>
  <text x="660" y="432" font-family="Times New Roman, Times, serif" font-size="32" fill="#555555" text-anchor="middle">Events on a map</text>

  <rect x="880" y="345" width="320" height="110" rx="16" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="3"/>
  <text x="1040" y="396" font-family="Times New Roman, Times, serif" font-size="39" font-weight="bold" fill="#212121" text-anchor="middle">My Plans</text>
  <text x="1040" y="432" font-family="Times New Roman, Times, serif" font-size="32" fill="#555555" text-anchor="middle">Saved + schedule</text>

  <rect x="1260" y="345" width="320" height="110" rx="16" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="3"/>
  <text x="1420" y="396" font-family="Times New Roman, Times, serif" font-size="39" font-weight="bold" fill="#212121" text-anchor="middle">Profile</text>
  <text x="1420" y="432" font-family="Times New Roman, Times, serif" font-size="32" fill="#555555" text-anchor="middle">Account + Passport</text>

  <line x1="280" y1="343" x2="280" y2="188" stroke="#424242" stroke-width="4"/>
  <polygon points="280,162 268,188 292,188" fill="#424242"/>
  <text x="300" y="262" font-family="Times New Roman, Times, serif" font-size="32" font-style="italic" fill="#424242">search bar or camera</text>

  <line x1="1345" y1="313" x2="1345" y2="188" stroke="#424242" stroke-width="4"/>
  <polygon points="1345,162 1333,188 1357,188" fill="#424242"/>
  <text x="1325" y="262" font-family="Times New Roman, Times, serif" font-size="32" font-style="italic" fill="#424242" text-anchor="end">tap any event, on any tab</text>

  <text x="850" y="527" font-family="Times New Roman, Times, serif" font-size="32" fill="#595959" text-anchor="middle">Bottom navigation bar (always visible)</text>
  <rect x="60" y="551" width="26" height="26" rx="4" fill="#006B5F"/>
  <text x="98" y="574" font-family="Times New Roman, Times, serif" font-size="30" fill="#595959">Built as a CW1 XML layout · Search &amp; Filter and Event Details open on top of the tabs with a back arrow</text>
